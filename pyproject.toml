[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "arr-mcp"
version = "2.3.6"
description = "Arr Suite MCP Server for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "scion-sdk[mcp]>=0.6.0,<0.7.0", "tree-sitter>=0.26.0", "pydantic>=2.14.1",]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0",]

[project.scripts]
arr-mcp = "scion_sdk.cli:serve"

[project.entry-points."scion_sdk.prompt_providers"]
arr-mcp = "arr_mcp.prompts"

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."scion_sdk.connector"]
arr-mcp = "arr_mcp:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]


[tool.ruff]
extend-exclude = ["tests", "scripts"]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
arr_mcp = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.vulture]
ignore_names = ["connector", "stream"]

[tool.pipelines.container]
debug_apt = ["default-jre", "ripgrep", "tree", "fd-find", "curl", "nano", "build-essential", "cmake", "libssl-dev", "libcurl4-openssl-dev", "pkg-config", "cargo", "rustc"]
image_var = "ARR_MCP_MCP_IMAGE"
restart = "always"
tmpfs_size = "64m"
compose_host = {env = "ARR_MCP_MCP_BIND_ADDRESS", default = "127.0.0.1"}
publish_port = {env = "ARR_MCP_MCP_PORT", default = 8000}
container_name = "arr-mcp-mcp"
hostname = "arr-mcp-mcp"
compose_env = ["AUTH_TYPE=${AUTH_TYPE:?set-AUTH_TYPE-to-a-configured-auth-provider}"]
limits = {mcp = {memory_limit_env = "MCP_CONTAINER_MEMORY_LIMIT", memory_limit = "2g", cpu_limit_env = "MCP_CONTAINER_CPU_LIMIT", cpu_limit = "1.0"}}

[tool.pipelines.codespell]
exclude = [".specify"]
